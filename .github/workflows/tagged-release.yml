name: Create tagged prerelease

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable prerelease tag to publish"
        required: true
        type: string
      publish_release:
        description: "Publish the validated candidate as a GitHub prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  EXPECTED_VERSION_CODE: "37"
  EXPECTED_VERSION_NAME: "1.1.3-rc11"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      release_tag_target: ${{ steps.release-tag.outputs.expected_target }}

    steps:
      - name: Validate existing release tag
        id: release-tag
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          manual_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-(nightly\.[0-9]+|rc[0-9]+|prerelease)$'
          pushed_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$TAG" =~ $manual_tag_pattern ]]; then
              echo "Invalid manual release tag: $TAG" >&2
              exit 1
            fi
          elif [[ ! "$TAG" =~ $pushed_tag_pattern ]]; then
            echo "Invalid pushed release tag: $TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$EXPECTED_VERSION_NAME" ]]; then
            echo "Release tag does not match the APK version" >&2
            exit 1
          fi

          tag_oid=""
          peeled_oid=""
          while read -r oid ref; do
            case "$ref" in
              "refs/tags/$TAG") tag_oid="$oid" ;;
              "refs/tags/$TAG^{}") peeled_oid="$oid" ;;
            esac
          done < <(
            git ls-remote --tags "$REPOSITORY_URL" \
              "refs/tags/$TAG" "refs/tags/$TAG^{}"
          )
          if [ -z "$tag_oid" ]; then
            echo "Release tag does not exist: $TAG" >&2
            exit 1
          fi
          expected_target="${peeled_oid:-$tag_oid}"
          if [[ ! "$expected_target" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "Release tag target is invalid" >&2
            exit 1
          fi
          printf 'expected_target=%s\n' "$expected_target" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked-out release tag target
        env:
          EXPECTED_TAG_TARGET: ${{ steps.release-tag.outputs.expected_target }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          checked_out_commit="$(git rev-parse HEAD)"
          tag_target="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_target" != "$EXPECTED_TAG_TARGET" ]; then
            echo "Release tag target changed before checkout" >&2
            exit 1
          fi
          if [ "$checked_out_commit" != "$tag_target" ]; then
            echo "Checked-out commit does not match release tag target" >&2
            exit 1
          fi

      - name: set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Keystore
        if: ${{ github.repository != 'Darkaxt/GameNative' }}
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          mkdir -p app/keystores
          echo "$KEYSTORE" | base64 --decode > app/keystores/keystore
          echo "storeFile=keystores/keystore" >> app/keystores/keystore.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> app/keystores/keystore.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> app/keystores/keystore.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> app/keystores/keystore.properties

      - name: Configure Production Keystore
        if: ${{ github.repository != 'Darkaxt/GameNative' }}
        env:
          PROD_KEYSTORE: ${{ secrets.PROD_KEYSTORE }}
          PROD_KEYSTORE_KEY_ALIAS: ${{ secrets.PROD_KEYSTORE_KEY_ALIAS }}
          PROD_KEYSTORE_KEY_PASSWORD: ${{ secrets.PROD_KEYSTORE_KEY_PASSWORD }}
          PROD_KEYSTORE_STORE_PASSWORD: ${{ secrets.PROD_KEYSTORE_STORE_PASSWORD }}
        run: |
          mkdir -p app/keystores
          echo "$PROD_KEYSTORE" | base64 --decode > app/keystores/prod.keystore
          cat <<EOF > app/keystores/prod-keystore.properties
          keyAlias=$PROD_KEYSTORE_KEY_ALIAS
          keyPassword=$PROD_KEYSTORE_KEY_PASSWORD
          storePassword=$PROD_KEYSTORE_STORE_PASSWORD
          EOF

      - name: Configure Fork Keystore
        if: ${{ github.repository == 'Darkaxt/GameNative' }}
        env:
          FORK_KEYSTORE: ${{ secrets.FORK_KEYSTORE }}
          FORK_KEYSTORE_ALIAS: ${{ secrets.FORK_KEYSTORE_ALIAS }}
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FORK_KEYSTORE FORK_KEYSTORE_ALIAS FORK_KEYSTORE_PASSWORD FORK_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Required fork signing secret is not configured: $name" >&2
              exit 1
            fi
          done
          mkdir -p app/keystores
          printf '%s' "$FORK_KEYSTORE" | base64 --decode > app/keystores/fork-release.jks
          chmod 600 app/keystores/fork-release.jks
          test -s app/keystores/fork-release.jks

      - name: Inject credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          CLOUD_PROJECT_NUMBER: ${{ secrets.CLOUD_PROJECT_NUMBER }}
        run: |
          : > local.properties
          for name in POSTHOG_API_KEY POSTHOG_HOST STEAMGRIDDB_API_KEY CLOUD_PROJECT_NUMBER; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> local.properties
            fi
          done

      - name: Install Android SDK Build Tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Build with Gradle
        run: |
          ./gradlew \
            :app:bundleLegacyRelease \
            :app:bundleLegacyXrRelease \
            :app:bundleLegacyReleaseDarkaxt \
            :app:bundleLegacyXrReleaseDarkaxt

      - name: Stage bundles
        run: |
          cp app/build/outputs/bundle/legacyRelease/app-legacy-release.aab app-compat.aab
          cp app/build/outputs/bundle/legacyXrRelease/app-legacyXr-release.aab app-compat-legacy-xr.aab
          cp app/build/outputs/bundle/legacyReleaseDarkaxt/app-legacy-releaseDarkaxt.aab app-side-by-side.aab
          cp app/build/outputs/bundle/legacyXrReleaseDarkaxt/app-legacyXr-releaseDarkaxt.aab app-side-by-side-legacy-xr.aab

      - name: Extract APKs from Bundles
        run: |
          for channel in compat compat-legacy-xr side-by-side side-by-side-legacy-xr; do
            java -jar tools/bundletool-all-1.17.2.jar build-apks \
              --bundle="app-${channel}.aab" \
              --output="app-${channel}.apks" \
              --mode=universal
            unzip -p "app-${channel}.apks" universal.apk > "universal-${channel}.apk"
          done

      - name: Copy lineage file
        if: ${{ github.repository != 'Darkaxt/GameNative' }}
        run: |
          mkdir -p app/keystores
          cp prod-debug.lineage app/keystores/prod-debug.lineage

      - name: Dual sign universal APKs
        if: ${{ github.repository != 'Darkaxt/GameNative' }}
        env:
          DEBUG_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          DEBUG_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          DEBUG_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          PROD_ALIAS: ${{ secrets.PROD_KEYSTORE_KEY_ALIAS }}
          PROD_KEY_PASS: ${{ secrets.PROD_KEYSTORE_KEY_PASSWORD }}
          PROD_STORE_PASS: ${{ secrets.PROD_KEYSTORE_STORE_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/34.0.0"
          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          fi
          for apk in universal-compat.apk universal-compat-legacy-xr.apk universal-side-by-side.apk universal-side-by-side-legacy-xr.apk; do
            "${BUILD_TOOLS_DIR}/apksigner" sign \
              --lineage app/keystores/prod-debug.lineage \
              --ks app/keystores/keystore \
              --ks-key-alias "$DEBUG_ALIAS" \
              --ks-pass pass:$DEBUG_STORE_PASS \
              --key-pass pass:$DEBUG_KEY_PASS \
              --next-signer --ks app/keystores/prod.keystore \
              --ks-key-alias "$PROD_ALIAS" \
              --ks-pass pass:$PROD_STORE_PASS \
              --key-pass pass:$PROD_KEY_PASS \
              --out "${apk%.apk}-signed.apk" \
              "$apk"
            mv "${apk%.apk}-signed.apk" "$apk"
          done

      - name: Sign universal APKs with persistent fork key
        if: ${{ github.repository == 'Darkaxt/GameNative' }}
        env:
          FORK_KEYSTORE_ALIAS: ${{ secrets.FORK_KEYSTORE_ALIAS }}
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/34.0.0"
          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          fi
          for apk in universal-compat.apk universal-compat-legacy-xr.apk universal-side-by-side.apk universal-side-by-side-legacy-xr.apk; do
            "${BUILD_TOOLS_DIR}/apksigner" sign \
              --ks app/keystores/fork-release.jks \
              --ks-type JKS \
              --ks-key-alias "$FORK_KEYSTORE_ALIAS" \
              --ks-pass env:FORK_KEYSTORE_PASSWORD \
              --key-pass env:FORK_KEY_PASSWORD \
              --out "${apk%.apk}-signed.apk" \
              "$apk"
            mv "${apk%.apk}-signed.apk" "$apk"
          done

      - name: Rename signed APKs
        run: |
          TAG="${RELEASE_TAG}"
          mv universal-compat.apk "gamenative-$TAG-compat.apk"
          mv universal-compat-legacy-xr.apk "gamenative-$TAG-compat-legacy-xr.apk"
          mv universal-side-by-side.apk "gamenative-$TAG-side-by-side.apk"
          mv universal-side-by-side-legacy-xr.apk "gamenative-$TAG-side-by-side-legacy-xr.apk"

      - name: Verify APK signatures, packages, versions, and generate checksums
        env:
          EXPECTED_FORK_CERT_SHA256: 90d491f4c194d4f6e9efaf2ba1a548e59388edd9ecbd96853d330fe6a9c260c9
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/34.0.0"
          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          fi
          APKANALYZER="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$APKANALYZER" ]; then
            APKANALYZER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/apkanalyzer"
          fi
          if [ ! -x "$APKANALYZER" ]; then
            echo "Android SDK apkanalyzer is not executable" >&2
            exit 1
          fi
          ARTIFACTS=(
            "gamenative-${RELEASE_TAG}-compat.apk|app.gamenative"
            "gamenative-${RELEASE_TAG}-compat-legacy-xr.apk|app.gamenative"
            "gamenative-${RELEASE_TAG}-side-by-side.apk|app.gamenative.darkaxt"
            "gamenative-${RELEASE_TAG}-side-by-side-legacy-xr.apk|app.gamenative.darkaxt"
          )
          APKS=()
          for artifact in "${ARTIFACTS[@]}"; do
            IFS='|' read -r apk expected_package <<< "$artifact"
            test -f "$apk"
            actual_package=$("$APKANALYZER" manifest application-id "$apk")
            actual_version_code=$("$APKANALYZER" manifest version-code "$apk")
            actual_version_name=$("$APKANALYZER" manifest version-name "$apk")
            if [ "$actual_package" != "$expected_package" ]; then
              echo "Unexpected package for $apk" >&2
              exit 1
            fi
            if [ "$actual_version_code" != "$EXPECTED_VERSION_CODE" ]; then
              echo "Unexpected version code for $apk" >&2
              exit 1
            fi
            if [ "$actual_version_name" != "$EXPECTED_VERSION_NAME" ]; then
              echo "Unexpected version name for $apk" >&2
              exit 1
            fi
            verify_output=$("${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "$apk")
            if ! grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" <<< "$verify_output"; then
              echo "APK Signature Scheme v2 verification failed for $apk" >&2
              exit 1
            fi
            if [ "$GITHUB_REPOSITORY" = "Darkaxt/GameNative" ]; then
              actual_digest=""
              while IFS= read -r line; do
                if [[ "$line" == *"certificate SHA-256 digest: "* ]]; then
                  actual_digest="${line##*: }"
                  actual_digest="${actual_digest,,}"
                  break
                fi
              done <<< "$verify_output"
              if [ "$actual_digest" != "$EXPECTED_FORK_CERT_SHA256" ]; then
                echo "Unexpected fork signer certificate for $apk" >&2
                exit 1
              fi
            fi
            APKS+=("$apk")
            echo "Verified $apk"
          done
          sha256sum "${APKS[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload release assets for next job
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            gamenative-${{ env.RELEASE_TAG }}-compat.apk
            gamenative-${{ env.RELEASE_TAG }}-compat-legacy-xr.apk
            gamenative-${{ env.RELEASE_TAG }}-side-by-side.apk
            gamenative-${{ env.RELEASE_TAG }}-side-by-side-legacy-xr.apk
            SHA256SUMS

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: ./

      - name: Build release notes
        run: |
          : > release-body.md
          cat <<'EOF' >> release-body.md
          ## Choose an install channel

          - **Side-by-side (recommended):** installs as `app.gamenative.darkaxt` and coexists with official GameNative. On first installation, sign in and create or import the container data you need. Every later side-by-side update installs over it; do not uninstall first.
          - **Compatibility:** installs as `app.gamenative` and upgrades an existing compatibility installation, but cannot coexist with official GameNative.

          Side-by-side uses `GameNative-Darkaxt` for new public installations. Do not copy official private tokens, Keystore data, containers, or `Android/data` content. `nxm://` may show an Android chooser when both apps are installed. The in-app updater is disabled; use verified Darkaxt GitHub releases for updates.

          EOF
          if [ "$GITHUB_REPOSITORY" = "Darkaxt/GameNative" ]; then
            cat <<'EOF' >> release-body.md
          ## Persistent fork signing identity

          All four APKs are signed by the persistent Darkaxt fork release key (certificate SHA-256 `90d491f4c194d4f6e9efaf2ba1a548e59388edd9ecbd96853d330fe6a9c260c9`). Future Darkaxt releases signed by this key can upgrade these APKs in place.

          EOF
          fi
          cat <<'EOF' >> release-body.md
          ## Downloads
          EOF
          printf '%s\n' \
            "- **\`gamenative-${RELEASE_TAG}-compat.apk\`** — Standard compatibility build." \
            "- **\`gamenative-${RELEASE_TAG}-compat-legacy-xr.apk\`** — XR compatibility build for Quest headsets." \
            "- **\`gamenative-${RELEASE_TAG}-side-by-side.apk\`** — Recommended standard side-by-side build." \
            "- **\`gamenative-${RELEASE_TAG}-side-by-side-legacy-xr.apk\`** — Recommended XR side-by-side build for Quest headsets." \
            '- **`SHA256SUMS`** — SHA-256 checksums for all four APKs.' \
            >> release-body.md

      - name: Verify release tag remains immutable
        env:
          EXPECTED_TAG_TARGET: ${{ needs.build.outputs.release_tag_target }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          tag_oid=""
          peeled_oid=""
          while read -r oid ref; do
            case "$ref" in
              "refs/tags/$RELEASE_TAG") tag_oid="$oid" ;;
              "refs/tags/$RELEASE_TAG^{}") peeled_oid="$oid" ;;
            esac
          done < <(
            git ls-remote --tags "$REPOSITORY_URL" \
              "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}"
          )
          if [ -z "$tag_oid" ]; then
            echo "Release tag no longer exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "${peeled_oid:-$tag_oid}" != "$EXPECTED_TAG_TARGET" ]; then
            echo "Release tag target changed after build" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Dual GameNative channels — ${{ env.RELEASE_TAG }}
          prerelease: true
          generate_release_notes: true
          append_body: true
          body_path: release-body.md
          files: |
            gamenative-${{ env.RELEASE_TAG }}-compat.apk
            gamenative-${{ env.RELEASE_TAG }}-compat-legacy-xr.apk
            gamenative-${{ env.RELEASE_TAG }}-side-by-side.apk
            gamenative-${{ env.RELEASE_TAG }}-side-by-side-legacy-xr.apk
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
