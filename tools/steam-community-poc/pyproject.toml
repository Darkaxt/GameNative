[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-community-poc"
version = "0.1.0"
description = "Bounded standalone Steam reviews and discussions proof of concept"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
steam-community-poc = "steam_community_poc.cli:main"
steam-community-poc-live = "steam_community_poc.live_validation:main"
steam-community-poc-discussions-10 = "steam_community_poc.discussion_validation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
steam_community_poc = ["result.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
